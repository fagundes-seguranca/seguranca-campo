<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00379e">
<!--PWA--><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><!--/PWA-->
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Segurança em Campo · Fagundes</title>
<style>
:root{
  --az:#00379e;--az2:#0b4fc9;--az-cl:#e9effc;--az-esc:#00256b;--vd:#95d324;--vd-esc:#4f7d0a;--cz:#98989a;
  --bg:#eef1f6;--card:#fff;--tx:#141b2b;--tx2:#545d6f;--tx3:#8a91a0;--bd:#e2e6ee;--bd2:#cfd5e0;
  --ok:#1f8f3a;--warn:#c97a00;--err:#c93434;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --r:14px;--sh:0 1px 2px rgba(16,30,60,.06),0 2px 8px rgba(16,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- topo ---------- */
header{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,var(--az-esc),var(--az) 55%,#0a4fc0);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,30,90,.25)}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-style:italic;letter-spacing:.6px;font-size:17px;white-space:nowrap}
.logo svg{width:40px;height:22px}
.htit{flex:1;min-width:0;border-left:1px solid rgba(255,255,255,.3);padding-left:12px;line-height:1.15}
.htit b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htit span{font-size:11.5px;opacity:.8}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--cz)}
.pill.on i{background:var(--vd)}.pill.off i{background:#ff7676}.pill.sync i{background:#ffd34d;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.uchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;border-radius:22px;padding:3px 10px 3px 3px;color:#fff;cursor:pointer}
.uchip .av{width:30px;height:30px;font-size:12px}
.uchip small{font-size:12px;font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.uchip small,.pill span,.htit span{display:none}.logo{font-size:0;gap:0}}
/* ---------- estrutura ---------- */
.shell{display:flex;min-height:calc(100vh - 56px)}
aside{display:none}
main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
main.estreito{max-width:780px}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(16,30,60,.06)}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:10.5px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
nav.bot button.at{color:var(--az);font-weight:700}
nav.bot button.at::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--vd);border-radius:0 0 3px 3px}
.bdg{position:absolute;top:2px;left:56%;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3}
@media(min-width:980px){
  aside{display:flex;flex-direction:column;gap:4px;width:224px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:56px;height:calc(100vh - 56px)}
  aside button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:14.5px;color:var(--tx2);cursor:pointer;text-align:left;position:relative}
  aside button:hover{background:#f3f5f9}
  aside button.at{background:var(--az-cl);color:var(--az);font-weight:700}
  aside button.at::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--az)}
  aside .bdg{position:static;margin-left:auto}
  aside .rod{margin-top:auto;font-size:11.5px;color:var(--tx3);padding:10px 12px;font-style:italic}
  body.adm nav.bot{display:none}
  body.adm main{padding-bottom:40px}
}
/* ---------- elementos ---------- */
h1{font-size:22px;margin:0 0 4px;color:var(--tx)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.sub{color:var(--tx2);font-size:13.5px;margin:0 0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card.p0{padding:0;overflow:hidden}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f1{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:12px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--az);color:#fff;min-height:44px;text-decoration:none;font-size:14.5px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--az);border:1.5px solid var(--bd2)}
.btn.vd{background:var(--vd);color:#18320a}
.btn.ghost{background:transparent;color:var(--az);padding:7px 10px;min-height:34px}
.btn.perigo{background:#fff;color:var(--err);border:1.5px solid #f0c4c4}
.btn.bl{width:100%}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--bd2);border-radius:10px;background:#fff;color:var(--tx);min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--az2);outline-offset:-1px;border-color:transparent}
select.mini{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.campo{margin-bottom:13px}.campo:last-child{margin-bottom:0}
.campo>label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.req{color:var(--err)}
.err-campo input,.err-campo textarea,.err-campo select,.err-campo .chips{outline:2px solid var(--err);outline-offset:1px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:440px){.grid2.r{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;border:1px solid var(--bd2);background:#fff;font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--az);color:#fff;border-color:var(--az)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--bd2);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.at{background:var(--az);color:#fff;border-color:var(--az)}
.av{width:44px;height:44px;border-radius:50%;background:var(--az);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.st.pendente,.st.aberta{background:#fff1d6;color:#8a5800}
.st.sincronizado,.st.concluida{background:#e1f3e5;color:#17702f}
.st.rejeitado,.st.vencida{background:#fbe1e1;color:#a52525}
.st.cancelado{background:#eceef2;color:#666}
.aviso{background:#fff7e3;border:1px solid #f0d58e;color:#6e4b00;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.info{background:var(--az-cl);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;color:#1b3a78}
.vazio{text-align:center;color:var(--tx2);padding:34px 10px}
.vazio svg.i{width:38px;height:38px;color:var(--cz);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#141b2b;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:sobe .2s}
.toast.erro{background:var(--err)}.toast.ok{background:var(--ok)}
@keyframes sobe{from{opacity:0;transform:translate(-50%,10px)}}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-c{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-c h2{margin-top:0}
/* ---------- login ---------- */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,#1d5fd6 0,transparent 55%),linear-gradient(160deg,var(--az-esc),var(--az))}
.login{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,20,70,.35)}
.login .marca{display:flex;align-items:center;gap:10px;color:var(--az);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.6px;margin-bottom:4px}
.login .marca svg{width:52px;height:28px}
.login .tit{font-size:14px;color:var(--tx2);margin-bottom:22px}
.login .slogan{text-align:center;color:var(--cz);font-size:12px;margin-top:18px;font-style:italic}
.senha{position:relative}.senha button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--tx3);padding:6px;cursor:pointer}
/* ---------- lançar ---------- */
.hello{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#fff,#f4f7fd);}
.hello .av{width:52px;height:52px;font-size:19px}
.syncbar{display:flex;align-items:center;gap:12px}
.syncbar .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#e1f3e5;color:var(--ok);flex:none}
.syncbar.pend .ic{background:#fff1d6;color:var(--warn)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.doc{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);transition:transform .1s,box-shadow .15s;position:relative;overflow:hidden}
.doc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.doc:hover{box-shadow:0 6px 18px rgba(16,30,60,.12)}
.doc:active{transform:scale(.99)}
.doc .di{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.doc .di svg.i{width:26px;height:26px}
.doc b{display:block;font-size:15.5px;color:var(--tx)}
.doc small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.doc code{font-size:11px;color:var(--tx3);font-family:inherit}
.doc .seta{margin-left:auto;color:var(--tx3)}
/* ---------- formulário ---------- */
.fhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.fhead .di{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.sec{background:#fff;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden}
.sec-t{color:var(--az);font-weight:700;padding:11px 16px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:#fafbfd;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--vd)}
.sec-b{padding:14px 16px}
.cnt-gt{font-weight:700;font-size:13px;color:var(--az);margin:10px 0 4px}
.cnt{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}
.cnt .n{flex:1;font-size:14px}.cnt .n b{color:var(--az);margin-right:5px}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd2);background:#fff;font-size:20px;font-weight:700;color:var(--az);cursor:pointer}
.cnt output{min-width:28px;text-align:center;font-weight:800;font-size:17px}
.cnt output.nz{color:var(--err)}
.linha{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
.linha-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--az);margin-bottom:8px}
.calc{background:var(--az-cl);border-radius:12px;padding:12px}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc td,.calc th{padding:5px 6px;border-bottom:1px solid #d3dcf0;text-align:center}
.calc th{color:var(--az)}
.ips-res{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.ips-res .v{font-size:30px;font-weight:800}
.classe{font-weight:800;padding:5px 12px;border-radius:8px;color:#fff;font-size:12.5px;display:inline-block}
.c-EXCELENTE{background:#1f8f3a}.c-BOM{background:#5f9a12}.c-REGULAR{background:#c98a00}.c-INSATISFATÓRIO{background:#c93434}.c-—{background:#999}
.ajuda{font-size:12px;color:var(--tx2);background:#f6f7fa;border-radius:10px;padding:9px 11px;margin-top:8px}
.ajuda b{color:var(--tx)}
.barra-acoes{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 35%);padding:16px 0 4px;z-index:5}
@media(min-width:980px){body.adm .barra-acoes{bottom:0}}
.barra-acoes .btn{flex:1}
/* ---------- listas ---------- */
.item{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{border-color:var(--bd2)}
.item .di{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.item .t{font-weight:700;font-size:14px}
.item .s{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--bd);padding:8px 7px;text-align:left;vertical-align:top}
table.tb th{color:var(--tx2);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;background:#fafbfd;position:sticky;top:0}
table.tb td.n,table.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
table.tb tr.cl{cursor:pointer}table.tb tr.cl:hover td{background:#f7f9fd}
.tbw{overflow-x:auto;max-height:520px;overflow-y:auto}
.det dt{font-size:12px;color:var(--tx2);font-weight:600;margin-top:10px}
.det dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
/* ---------- painel ---------- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;box-shadow:var(--sh)}
.filtros .lb{font-size:12px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px 15px;border:1px solid var(--bd);box-shadow:var(--sh);position:relative}
.kpi .l{font-size:12px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l svg.i{width:16px;height:16px;color:var(--az)}
.kpi .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--tx2);margin-top:2px}
.kpi .d .up{color:var(--ok);font-weight:700}.kpi .d .dn{color:var(--err);font-weight:700}
.grid-p{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.grid-p>.card{margin:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.ch-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch-t b{font-size:15px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--tx2)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.colchart{position:relative;height:200px;display:flex;align-items:flex-end;gap:3px;padding-left:30px;border-bottom:1px solid var(--bd2)}
.colchart .gl{position:absolute;left:30px;right:0;border-top:1px dashed #e3e7ee;font-size:10.5px;color:var(--tx3)}
.colchart .gl span{position:absolute;left:-30px;top:-7px;width:26px;text-align:right}
.colchart .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default;min-width:0}
.colchart .col:hover{background:rgba(0,55,158,.05)}
.colchart .stack{width:min(80%,26px);display:flex;flex-direction:column-reverse;gap:2px}
.colchart .stack i{display:block;min-height:2px}
.colchart .stack i:last-child{border-radius:4px 4px 0 0}
.xlab{display:flex;gap:3px;padding-left:30px;font-size:10.5px;color:var(--tx3);margin-top:4px}
.xlab span{flex:1;text-align:center;white-space:nowrap;overflow:visible;min-width:0}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 42px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.hb .tr{height:14px;background:#f0f2f6;border-radius:0 4px 4px 0;position:relative}
.hb .br{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.distr{display:flex;height:30px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.distr i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;font-style:normal;min-width:2px}
svg.lc{width:100%;height:auto;display:block}
svg.lc text{font-size:11px;fill:var(--tx3);font-family:inherit}
.tip{position:fixed;z-index:120;background:#141b2b;color:#fff;font-size:12.5px;padding:8px 10px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:260px;line-height:1.4}
.tip b{color:#fff}
.pess{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:13px;padding:12px 13px;margin-bottom:8px}
.pess.s-pend{border-left-color:var(--warn)}.pess.s-perda{border-left-color:var(--err)}.pess.s-sem{border-left-color:#e07b39}.pess.s-nunca{border-left-color:var(--cz)}
.pess .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{display:inline-block;font-size:11.5px;background:#eef1f6;border-radius:6px;padding:2px 8px;margin:4px 4px 0 0}
.alerta{background:#fdeeee;color:#a32020;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.semlanc{display:flex;flex-wrap:wrap;gap:6px}

/* =================== v3 – identidade Fagundes =================== */
.marca-f{display:inline-flex;align-items:center;gap:9px;line-height:1}
.marca-f svg{height:24px;width:auto;flex:none}

/* ------------------------------ Cálculos ------------------------------ */
function calcIPS(d){
 const rows=(d.desvios||[]).filter(r=>r.codigo||r.desvio);const q={'0.3':0,'1':0,'3':0};let soma=0,total=0;const porCat={};
 rows.forEach(r=>{const n=+r.qtd||0,p=+r.peso||0,k=String(p);if(k in q)q[k]+=n;total+=n;soma+=n*p;if(r.codigo)porCat[r.codigo]=(porCat[r.codigo]||0)+n;});
 const N=+d.pessoasObservadas||0,ips=N>0?Math.max(0,(1-soma/N)*100):null;
 return {q,soma:+soma.toFixed(2),total,ips,classe:classeIPS(ips),porCat,N};}
const classeIPS=ips=>ips==null?'—':ips>95?'EXCELENTE':ips>=86?'BOM':ips>=76?'REGULAR':'INSATISFATÓRIO';
const fmtN=(v,c=1)=>v==null||isNaN(v)?'—':Number(v).toFixed(c).replace('.',',');
function calcIPSHTML(d){
 const c=calcIPS(d),pc=k=>c.total?Math.round(c.q[k]/c.total*100)+'%':'0%';
 return `<table><tr><th></th><th>Baixo 0,3</th><th>Médio 1</th><th>Alto 3</th></tr>
 <tr><td><b>Quantidade</b></td><td>${c.q['0.3']}</td><td>${c.q['1']}</td><td>${c.q['3']}</td></tr>
 <tr><td><b>Percentual</b></td><td>${pc('0.3')}</td><td>${pc('1')}</td><td>${pc('3')}</td></tr></table>
 <div class="ips-res"><div><div class="muted">Total de desvios <b>${c.total}</b> · Soma ponderada <b>${fmtN(c.soma,1)}</b> · Pessoas <b>${c.N||'—'}</b></div>
 <div class="v">IPS ${c.ips==null?'—':fmtN(c.ips)+'%'}</div></div><span class="classe c-${c.classe}">${c.classe}</span></div>
 <div class="ajuda">IPS = (1 − Σ(Qtd × Peso) ÷ Nº de pessoas observadas) × 100 · <b>Excelente</b> &gt; 95% · <b>Bom</b> 86–95% · <b>Regular</b> 76–85% · <b>Insatisfatório</b> &lt; 76%</div>`;}
function resumoCatsHTML(cats,porCat){
 const l=[];cats.forEach(([g,it])=>it.forEach(([k,n])=>{if(porCat[k])l.push(`<tr><td>${g[0]}</td><td style="text-align:left"><b>${k}</b> ${h(n)}</td><td><b>${porCat[k]}</b></td></tr>`);}));
 return l.length?`<table><tr><th>Grupo</th><th style="text-align:left">Categoria</th><th>Qtd</th></tr>${l.join('')}</table>`:'<span class="muted">Nenhum desvio classificado ainda.</span>';}
const totalCont=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const colsCats=(cats,porCat)=>{const o={};cats.forEach(([,it])=>it.forEach(([k,n])=>o[`${k} - ${n}`]=porCat[k]||0));return o;};

const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>isoD(new Date());
const agora=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const fData=s=>{if(!s)return '';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:s;};
const fDM=s=>{const m=String(s||'').match(/^\d{4}-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[1]}`:'';};
const fDT=ms=>{if(!ms)return '—';const d=new Date(ms);return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const tempo=ms=>{if(!ms)return 'nunca';const m=Math.round((Date.now()-ms)/60000);if(m<1)return 'agora';if(m<60)return `há ${m} min`;const hh=Math.round(m/60);if(hh<48)return `há ${hh} h`;return `há ${Math.round(hh/24)} dias`;};
const addDias=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);return isoD(new Date(y,m-1,d+n));};
const difDias=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime();};return Math.round((p(b)-p(a))/864e5);};
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)}));
const pessoaStr=p=>p?`${p.nome} – ${p.matricula}`:'';
const iniciais=n=>String(n||'?').replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase();
const primeiro=n=>{const w=String(n||'').split(' ')[0].toLowerCase();return w.charAt(0).toUpperCase()+w.slice(1);};
const saudacao=()=>{const hh=new Date().getHours();return hh<12?'Bom dia':hh<18?'Boa tarde':'Boa noite';};
async function hashSenha(mat,senha){const s='fag#'+String(mat).trim()+'#'+String(senha);
 if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
 let x=0;for(const ch of s)x=(x*31+ch.charCodeAt(0))|0;return 'x'+x;}
function toast(msg,tipo){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast '+(tipo||'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),tipo==='erro'?5500:3000);}
function modal(html,onClick){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-c">${html}</div>`;document.body.appendChild(m);
 m.addEventListener('click',e=>{if(e.target===m){m.remove();return;}const b=e.target.closest('[data-m]');if(b){e.stopPropagation();onClick(b.dataset.m,m);}});return m;}
function confirmar(msg,sim='Sim'){return new Promise(res=>modal(`<p style="margin:0 0 16px">${h(msg)}</p><div class="row"><button class="btn sec f1" data-m="0">Não</button><button class="btn f1" data-m="1">${h(sim)}</button></div>`,(v,m)=>{m.remove();res(v==='1');}));}

/* ------------------------------ Armazenamento ------------------------------ */
let _db;
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const fim=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error);});
function idb(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{const r=indexedDB.open('fagundes-seguranca',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('registros',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
async function getMeta(k,def){const d=await idb();const v=await req(d.transaction('meta').objectStore('meta').get(k));return v?v.v:def;}
async function setMeta(k,v){const d=await idb();const t=d.transaction('meta','readwrite');t.objectStore('meta').put({k,v});return fim(t);}
async function allRegs(){const d=await idb();return req(d.transaction('registros').objectStore('registros').getAll());}
async function putReg(r){const d=await idb();const t=d.transaction('registros','readwrite');t.objectStore('registros').put(r);await fim(t);}
async function delReg(id){const d=await idb();const t=d.transaction('registros','readwrite');t.objectStore('registros').delete(id);await fim(t);}
function novoRegistro(rec,sigla){return idb().then(d=>new Promise((res,rej)=>{
 const t=d.transaction(['meta','registros'],'readwrite'),m=t.objectStore('meta'),g=m.get('seq');
 g.onsuccess=()=>{const seq=(g.result?g.result.v:0)+1;m.put({k:'seq',v:seq});rec.seq=seq;rec.numero=`${sigla}-${S.deviceId.slice(0,4).toUpperCase()}-${pad(seq,4)}`;t.objectStore('registros').put(rec);};
 t.oncomplete=()=>{S.seq=rec.seq;res(rec);};t.onerror=t.onabort=()=>rej(t.error);}));}

/* ------------------------------ Servidor ------------------------------ */
async function api(body,timeout=30000){
 if(window.DEMO_API)return window.DEMO_API(body);
 if(!S.cfg.apiUrl)throw new Error('Servidor não configurado');
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
 try{const r=await fetch(S.cfg.apiUrl,{method:'POST',body:JSON.stringify(body),redirect:'follow',signal:ctl.signal});
  const tx=await r.text();let j;try{j=JSON.parse(tx);}catch(e){throw new Error('Resposta inválida do servidor (confira o endereço e o acesso "Qualquer pessoa")');}
  if(j.ok===false&&j.erro)throw new Error(j.erro);return j;}
 catch(e){if(e.name==='AbortError')throw new Error('Tempo esgotado');throw e;}
 finally{clearTimeout(t);}}
const online=()=>window.DEMO_API?true:navigator.onLine;
function paraEnvio(r){const o={...r};if(DOCS[r.tipo]&&!r.cancelado){try{o.planilhas=DOCS[r.tipo].planilhas(r);}catch(e){o.planilhas=null;}}return o;}
function heartbeat(){const pend=S.regs.filter(r=>r.status==='pendente');const porM={};pend.forEach(r=>{const m=r.autor&&r.autor.matricula||'?';porM[m]=(porM[m]||0)+1;});
 return {action:'heartbeat',deviceId:S.deviceId,matricula:S.user?S.user.matricula:'',nome:S.user?S.user.nome:'',pendentes:pend.length,
  seqsPendentes:pend.filter(r=>r.deviceId===S.deviceId).map(r=>r.seq).join(','),porMatricula:porM,ultimoSeq:S.seq,versao:APP_VERSION,ua:navigator.userAgent.slice(0,140)};}
async function sincronizar(manual){
 if(S.syncing)return;
 if(!S.cfg.apiUrl&&!window.DEMO_API){if(manual)toast('Servidor não configurado neste aparelho','erro');return;}
 if(!online()){if(manual)toast('Sem internet — os lançamentos continuam guardados no aparelho');renderStatus();return;}
 S.syncing=true;renderStatus();
 try{
  await recarregarRegs();
  const pend=S.regs.filter(r=>r.status==='pendente').sort((a,b)=>a.seq-b.seq);
  for(let i=0;i<pend.length;i+=15){
   const lote=pend.slice(i,i+15);
   const res=await api({action:'sync',deviceId:S.deviceId,records:lote.map(paraEnvio)},60000);
   const acks=new Set(res.acks||[]),rej={};(res.rejeitados||[]).forEach(x=>rej[x.id]=x.motivo);
   for(const r of lote){
    if(acks.has(r.id)){r.status=r.cancelado?'cancelado':'sincronizado';r.sincronizadoEm=Date.now();r.erro='';delete r.auth;await putReg(r);}
    else if(rej[r.id]){r.status='rejeitado';r.erro=rej[r.id];delete r.auth;await putReg(r);}}}
  await recarregarRegs();
  await api(heartbeat());
  if(S.user&&S.user.matricula!=='admin'){try{const mr=await api({action:'meus',matricula:S.user.matricula,auth:S.auth});if(Array.isArray(mr.regs)){S.meusSrv={m:S.user.matricula,regs:mr.regs};await setMeta('meusSrv',S.meusSrv);}}catch(e){}}
  const c=await api({action:'cadastro'});
  if(Array.isArray(c.cadastro)){S.cadastro=mesclarCadastroPendente(c.cadastro);await setMeta('cadastro',S.cadastro);
   if(S.user&&S.user.matricula!=='admin'){const u=S.cadastro.find(p=>p.matricula===S.user.matricula);
    if(!u||u.ativo===false){toast('Seu acesso foi desativado pelo administrador.','erro');await sair(true);return;}
    S.user={...S.user,nome:u.nome,funcao:u.funcao,turno:u.turno,perfil:u.perfil||'LANÇADOR'};await setMeta('user',S.user);}}
  await aplicarMetasServidor(c.metas);await aplicarLocaisServidor(c.locais);
  S.lastSync=Date.now();await setMeta('lastSync',S.lastSync);S.lastErr='';
  await podar();
  if(manual)toast(pend.length?`${pend.length} lançamento(s) enviado(s) e confirmado(s)`:'Tudo sincronizado','ok');
 }catch(e){S.lastErr=e.message;if(manual)toast('Não sincronizou: '+e.message+' — nada foi perdido.','erro');}
 finally{S.syncing=false;renderStatus();if(!S.user){const m=$('#lgMat');if(!m||(!m.value&&!$('#lgSenha').value))render();}else if(['lancar','meus'].includes(S.tela)&&!S.verId)render();}}
function mesclarCadastroPendente(lista){const m=new Map(lista.map(p=>[p.matricula,p]));
 S.regs.filter(r=>r.tipo==='CADASTRO'&&r.status==='pendente').sort((a,b)=>a.seq-b.seq).forEach(r=>(r.dados.pessoas||[]).forEach(p=>m.set(p.matricula,{...m.get(p.matricula),...p,hash:p.hash||(m.get(p.matricula)||{}).hash})));
 return [...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome));}
async function podar(){const lim=Date.now()-45*864e5;for(const r of S.regs)if((r.status==='sincronizado'||r.status==='cancelado')&&r.sincronizadoEm&&r.sincronizadoEm<lim)await delReg(r.id);await recarregarRegs();}

  const hs=await hashSenha('admin',senha);let ok=false;
  if(online()&&(S.cfg.apiUrl||window.DEMO_API)){try{const r=await api({action:'login',pin:senha});ok=!!r.ok;if(ok){S.cfg.masterHash=hs;await setMeta('cfg',S.cfg);}}catch(e){ok=S.cfg.masterHash===hs;}}

 if(p.hash?hs!==p.hash:senha!==String(p.matricula)){toast('Senha incorreta','erro');$('#lgSenha').value='';return;}
 await iniciarSessao({matricula:p.matricula,nome:p.nome,funcao:p.funcao,turno:p.turno,perfil:p.perfil||'LANÇADOR'},{matricula:p.matricula,hash:hs});}

const METAS_VAZIA=()=>({padrao:{sem:{},men:{}},funcoes:{},pessoas:{}});
function metaDe(p){const M=S.metas||METAS_VAZIA();if(!p)return null;
 if(M.pessoas&&M.pessoas[p.matricula])return {...M.pessoas[p.matricula],origem:'Individual'};
 if((p.perfil||'LANÇADOR')==='ADMINISTRADOR'||p.matricula==='admin')return null;

/* ------------------------------ Backup ------------------------------ */
async function exportar(){
 const regs=S.regs.filter(r=>r.status!=='sincronizado'&&r.status!=='cancelado');
 if(!regs.length){toast('Não há lançamentos pendentes para backup.');return;}
 const data={app:'fagundes-seguranca',versao:APP_VERSION,deviceId:S.deviceId,exportadoEm:new Date().toISOString(),usuario:S.user&&{matricula:S.user.matricula,nome:S.user.nome},registros:regs.map(r=>{const o={...r};delete o.auth;return o;})};
 const d=new Date(),nome=`backup_${S.user?S.user.matricula:'aparelho'}_${isoD(d)}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),file=new File([blob],nome,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Segurança em Campo',text:`${regs.length} lançamento(s) pendente(s)`});return;}}catch(e){if(e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast(`Backup gerado com ${regs.length} lançamento(s)`,'ok');}
async function importar(file){
 try{const j=JSON.parse(await file.text());if(j.app!=='fagundes-seguranca'||!Array.isArray(j.registros))throw new Error('Arquivo não é um backup deste app');
  const ex=new Set(S.regs.map(r=>r.id));let n=0;
  for(const r of j.registros){if(!r.id||ex.has(r.id))continue;r.status='pendente';r.erro='';r.importado=true;await putReg(r);n++;}
  await recarregarRegs();toast(`${n} lançamento(s) importado(s). Enviando…`,'ok');sincronizar(true);render();
 }catch(e){toast('Falha ao importar: '+e.message,'erro');}}

async function carregarCentral(silencioso){
 if(!online()){if(!silencioso)toast('Sem internet — mostrando os últimos dados baixados','erro');return;}
 S.carregando=true;if(!silencioso)renderStatus();
 try{await sincronizar();const c=await api({action:'central',auth:S.auth},90000);
  c.registros=(c.registros||[]).map(r=>{if(typeof r.dados==='string'){try{r.dados=JSON.parse(r.dados);}catch(e){r.dados={};}}return r;});
  S.central=c;await setMeta('central',c);await aplicarMetasServidor(c.metas);await aplicarLocaisServidor(c.locais);if(!silencioso)toast('Dados atualizados','ok');
  if(['painel','pendencias','registros','acoes','ranking','metas','locais'].includes(S.tela)&&!S.verId&&!(S.tela==='metas'&&S.metasEdit)&&!(S.tela==='locais'&&S.locEdit&&JSON.stringify(S.locEdit)!==JSON.stringify(S.locais)))render();}
 catch(e){if(!silencioso||!S.central)toast('Falha ao carregar dados: '+e.message,'erro');}
 finally{S.carregando=false;}}
function periodo(per){per=per||S.per;const t=new Date();
 if(per==='custom')return [S.dIni||hoje(),S.dFim||hoje()];
 if(per==='hoje')return [hoje(),hoje()];
 if(per==='7d')return [addDias(hoje(),-6),hoje()];
 if(per==='30d')return [addDias(hoje(),-29),hoje()];
 if(per==='tudo')return [addDias(hoje(),-179),hoje()];
 const off=per==='cicloAnt'?-1:0,m=t.getMonth()+(t.getDate()>=20?1:0)+off;
 return [isoD(new Date(t.getFullYear(),m-1,20)),isoD(new Date(t.getFullYear(),m,19))];}
function periodoAnterior(a,b){if(S.per==='ciclo'){const [pa]=periodo('cicloAnt'),fimAt=b<hoje()?b:hoje();return [pa,addDias(pa,difDias(a,fimAt))];}if(S.per==='cicloAnt'){const t=new Date(),m=t.getMonth()+(t.getDate()>=20?1:0)-2;return [isoD(new Date(t.getFullYear(),m-1,20)),isoD(new Date(t.getFullYear(),m,19))];}
 const n=difDias(a,b)+1;return [addDias(a,-n),addDias(a,-1)];}
const PERS=[['custom','Personalizado (datas)'],['ciclo','Ciclo atual (20→19)'],['cicloAnt','Ciclo anterior'],['30d','Últimos 30 dias'],['7d','Últimos 7 dias'],['hoje','Hoje'],['tudo','Últimos 180 dias']];

function semDados(){return `<div class="card vazio">${ic('chart')}<div><b>Ainda sem dados do servidor</b></div><p class="muted">Toque em Atualizar com internet para baixar os lançamentos.</p><button class="btn" data-act="central-atualizar">${ic('sync')} Atualizar agora</button></div>`;}
const docsDoServidor=()=>(S.central?.registros||[]).filter(r=>DOCS[r.tipo]&&r.status!=='CANCELADO');
function filtrados(a,b,tipo){return docsDoServidor().filter(r=>r.d>=a&&r.d<=b&&(!S.fTurno||r.turno===S.fTurno)&&(tipo===undefined?(!S.fTipo||r.tipo===S.fTipo):(!tipo||r.tipo===tipo)));}
function tratativaDe(id){let t=null;(S.central?.registros||[]).forEach(r=>{if(r.tipo==='TRATATIVA'&&r.dados&&r.dados.ref===id&&(!t||r.c>t.c))t={...r.dados,c:r.c,por:r.nome};});
 S.regs.forEach(r=>{if(r.tipo==='TRATATIVA'&&r.dados.ref===id&&(!t||r.criadoEm>t.c))t={...r.dados,c:r.criadoEm,por:r.autor.nome};});return t;}
function statusAcao(ac,tr){if(tr&&tr.status==='Concluída'||ac.feita)return {k:'concluida',lab:'Concluída'};if(ac.prazo&&ac.prazo<hoje())return {k:'vencida',lab:`Vencida há ${difDias(ac.prazo,hoje())} dia(s)`};return {k:'aberta',lab:ac.prazo?`No prazo (${fDM(ac.prazo)})`:'Em aberto (sem prazo)'};}

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}

  <div class="xlab">${buckets.map((b,i)=>`<span>${i%passo===0?b.label:''}</span>`).join('')}</div>`;}
function chartLinhaIPS(pts){
 if(!pts.length)return `<div class="vazio" style="padding:20px">Sem IPS no período</div>`;
 const W=600,H=210,L=34,R=92,T=10,B=24,vals=pts.map(p=>p.v),mn=Math.max(0,Math.min(70,Math.floor((Math.min(...vals)-5)/10)*10));
 const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1),y=v=>T+(100-v)/(100-mn)*(H-T-B);
 const refs=[[95,'Excelente'],[86,'Bom'],[76,'Regular']].filter(([v])=>v>mn);

/* ------------------------------ Painel gerencial ------------------------------ */
function metricas(regs){
 const m={total:regs.length,por:{},ipsVals:[],pessoas:0,desvios:0,quase:0,relatos:0,classes:{EXCELENTE:0,BOM:0,REGULAR:0,'INSATISFATÓRIO':0},sev:{'0.3':0,'1':0,'3':0}};
 TIPOS.forEach(t=>m.por[t]=0);
 regs.forEach(r=>{m.por[r.tipo]++;const d=r.dados||{};
  if(r.tipo==='IPS'){const c=calcIPS(d);if(c.ips!=null){m.ipsVals.push(c.ips);m.classes[c.classe]++;}m.pessoas+=c.N;m.desvios+=c.total;Object.keys(m.sev).forEach(k=>m.sev[k]+=c.q[k]);}
  if(r.tipo==='COC'){m.pessoas+=+d.pessoasObservadas||0;m.desvios+=totalCont(d.contagens);}
  if(r.tipo==='RELATO'){m.relatos++;if((d.tipos||[]).includes('Quase Acidente'))m.quase++;}});
 m.ips=m.ipsVals.length?m.ipsVals.reduce((a,b)=>a+b,0)/m.ipsVals.length:null;return m;}
function delta(a,b,suf='',inv){if(a==null||b==null)return '<span class="tiny">sem base anterior</span>';const d=a-b;if(Math.abs(d)<0.05)return 'igual ao período anterior';const bom=inv?d<0:d>0;
 return `<span class="${bom?'up':'dn'}">${d>0?'▲':'▼'} ${fmtN(Math.abs(d),suf===' p.p.'?1:0)}${suf}</span> vs ${S.per==='ciclo'?'mesmo dia do ciclo anterior':'período anterior'}`;}

function buckets(a,b){const nd=difDias(a,b)+1,sem=nd>45,bk=[];
 if(sem){let s=a;while(s<=b){const e=addDias(s,6)>b?b:addDias(s,6);bk.push({a:s,b:e,label:fDM(s),tip:`Semana ${fData(s)} a ${fData(e)}`});s=addDias(s,7);}}
 else for(let i=0;i<nd;i++){const d=addDias(a,i);bk.push({a:d,b:d,label:fDM(d),tip:fData(d)});}
 return {bk,sem,idx:d=>bk.findIndex(x=>d>=x.a&&d<=x.b)};}

 <div class="grid-p">

const RKPERS=[['sem','Semana atual'],['semAnt','Semana anterior'],['ciclo','Mês – ciclo atual (20→19)'],['cicloAnt','Mês – ciclo anterior']];
function rankData(per,turno){
 const [a,b]=per==='sem'?semana(0):per==='semAnt'?semana(-1):periodo(per),chave=per.startsWith('sem')?'sem':'men';
 const cad=(S.central&&S.central.cadastro||S.cadastro).filter(p=>p.ativo!==false&&p.matricula!=='admin');
 const real={};docsDoServidor().forEach(r=>{if(r.d<a||r.d>b)return;const o=real[r.m]=real[r.m]||{};o[r.tipo]=(o[r.tipo]||0)+1;});
 const linhas=cad.map(p=>{const m=metaDe(p),meta=m?(m[chave]||{}):{},rr=real[p.matricula]||{},tot=TIPOS.reduce((s,t)=>s+(rr[t]||0),0),mt=somaMeta(meta);
  return {p,meta,real:rr,tot,mt,at:mt?atingimento(rr,meta):null,origem:m?m.origem:'—'};}).filter(l=>(l.mt||l.tot)&&(!turno||l.p.turno===turno));
 linhas.sort((x,y)=>(y.at??-1)-(x.at??-1)||y.tot-x.tot||x.p.nome.localeCompare(y.p.nome));linhas.forEach((l,i)=>l.pos=i+1);
 return {linhas,a,b,chave};}

 ${top.length?`<div class="podio">${ordem.map(l=>`<div class="pd pd${l.pos}"><div class="pd-av"><span class="av">${iniciais(l.p.nome)}</span><span class="med">${l.pos}º</span></div><b>${h(l.p.nome)}</b><div class="tiny">${h(l.p.funcao)} · Turno ${h(l.p.turno)}</div><div class="pd-v">${l.at==null?l.tot+' lanç.':fmtN(l.at,0)+'%'}</div><div class="tiny">${l.tot}${l.mt?'/'+l.mt:''} lançamentos</div><div class="pd-base">${l.pos}</div></div>`).join('')}</div>`:''}

function montarPessoas(){
 const c=S.central,[a,b]=periodo(),pes=new Map();
 const get=m=>{if(!pes.has(m)){const p=(c.cadastro||[]).find(x=>x.matricula===m)||S.cadastro.find(x=>x.matricula===m)||{matricula:m,nome:m==='admin'?'ADMINISTRADOR GERAL':'(não cadastrado) '+m,funcao:'',turno:''};pes.set(m,{...p,pend:0,contato:null,lacunas:[],porTipo:{},total:0});}return pes.get(m);};
 (c.cadastro||[]).filter(p=>p.ativo!==false).forEach(p=>get(p.matricula));
 (c.aparelhos||[]).forEach(ap=>{Object.entries(ap.porMatricula||{}).forEach(([m,n])=>{if(m&&m!=='?')get(m).pend+=n;});
  if(ap.matricula){const p=get(ap.matricula);if(!p.contato||ap.ultimoContato>p.contato)p.contato=ap.ultimoContato;if(ap.lacunas&&ap.lacunas.length)p.lacunas.push({ap:String(ap.id).slice(0,4).toUpperCase(),n:ap.lacunas});}});
 docsDoServidor().forEach(r=>{if(r.d<a||r.d>b)return;const p=get(r.m);p.porTipo[r.tipo]=(p.porTipo[r.tipo]||0)+1;p.total++;});
 return [...pes.values()].map(p=>{p.st=p.lacunas.length?'perda':p.pend?'pend':!p.contato?'nunca':(Date.now()-p.contato>24*3600e3?'sem':'ok');return p;});}

async function cadSalvar(){
 const ed=S.cadEdit&&S.cadEdit._ed,senha=$('#cSenha').value.trim();
 const p={matricula:$('#cMat').value.trim(),nome:$('#cNome').value.trim().toUpperCase(),funcao:$('#cFunc').value.trim().toUpperCase(),turno:$('#cTurno').value,perfil:(document.querySelector('input[name=cPerfil]:checked')||{}).value||'LANÇADOR',ativo:$('#cAtivo').checked};
 if(!p.matricula||!p.nome||!p.funcao){toast('Preencha matrícula, nome e função','erro');return;}
 if(p.matricula.toLowerCase()==='admin'){toast('Matrícula reservada','erro');return;}
 if(!ed&&S.cadastro.some(x=>x.matricula===p.matricula)){toast('Já existe colaborador com essa matrícula — use Editar','erro');return;}
 const adm=p.perfil==='ADMINISTRADOR';
 if(adm&&senha&&senha.length<4){toast('A senha deve ter pelo menos 4 caracteres','erro');return;}
 if(!adm)p.hash=await hashSenha(p.matricula,p.matricula);else if(senha||!ed||(S.cadEdit&&(S.cadEdit.perfil||'LANÇADOR')!=='ADMINISTRADOR'))p.hash=await hashSenha(p.matricula,senha||p.matricula);
 if(ed&&p.matricula===S.user.matricula&&p.perfil!=='ADMINISTRADOR'&&!await confirmar('Você está tirando seu próprio acesso de administrador. Continuar?'))return;
 await salvarPessoas([p]);S.cadEdit=null;toast(ed?'Colaborador atualizado':`Colaborador cadastrado. Senha: ${adm&&senha?'a definida':'a matrícula'}`,'ok');render();}
async function cadLote(txt){
 const linhas=(txt??$('#cLote').value).split(/\r?\n/).map(l=>l.trim()).filter(Boolean),ps=[],erros=[];
 for(const [i,l] of linhas.entries()){const c=l.split(/\t|;/).map(x=>x.trim());if(/^matr/i.test(c[0]))continue;
  if(c.length<4||!c[0]||!c[1]){erros.push(i+1);continue;}
  let t=c[3].toUpperCase().replace('TURNO','').trim();if(t.startsWith('ADM'))t='ADM';if(!TURNOS.includes(t)){erros.push(i+1);continue;}
  const perfil=/^adm/i.test(c[4]||'')?'ADMINISTRADOR':'LANÇADOR';
  ps.push({matricula:c[0],nome:c[1].toUpperCase(),funcao:(c[2]||'').toUpperCase(),turno:t,perfil,ativo:true,hash:await hashSenha(c[0],perfil==='ADMINISTRADOR'&&c[5]?c[5]:c[0])});}
 if(!ps.length){toast('Nenhuma linha válida. Formato: Matrícula · Nome · Função · Turno (A, B, C ou ADM)','erro');return;}
 for(let i=0;i<ps.length;i+=200)await salvarPessoas(ps.slice(i,i+200));
 toast(`${ps.length} colaborador(es) importado(s)`+(erros.length?` · linhas ignoradas: ${erros.slice(0,10).join(', ')}`:''),erros.length?'erro':'ok');render();}

/* ------------------------------ Leitor de planilha (.xlsx / .csv) – offline ------------------------------ */
async function lerPlanilha(file){
 const nome=file.name.toLowerCase();
 if(nome.endsWith('.csv')||nome.endsWith('.txt')){const t=await file.text();const sep=(t.split('\n')[0].match(/;/g)||[]).length?';':(t.includes('\t')?'\t':',');return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()));}
 if(!nome.endsWith('.xlsx'))throw new Error('Use o arquivo .xlsx do modelo (ou .csv)');
 if(typeof DecompressionStream==='undefined')throw new Error('Navegador antigo: atualize o Chrome ou use o Cadastro em lote (colar)');
 const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),td=new TextDecoder();
 let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Arquivo .xlsx inválido');
 const n=dv.getUint16(e+10,true),files={};let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);files[td.decode(buf.subarray(p+46,p+46+nl))]={comp:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};p+=46+nl+xl+cl;}
 const ler=async nm=>{const f=files[nm];if(!f)return null;const o=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),d=buf.subarray(o,o+f.size);
  if(f.comp===0)return td.decode(d);return td.decode(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());};
 const xml=t=>new DOMParser().parseFromString(t,'application/xml');
 let alvo='xl/worksheets/sheet1.xml';
 try{const wb=xml(await ler('xl/workbook.xml')),rid=wb.getElementsByTagName('sheet')[0].getAttribute('r:id'),rl=xml(await ler('xl/_rels/workbook.xml.rels'));
  for(const r of rl.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid){const t=r.getAttribute('Target');alvo=t.startsWith('/')?t.slice(1):'xl/'+t;}}catch(x){}
 const strs=[],ss=await ler('xl/sharedStrings.xml');if(ss)for(const si of xml(ss).getElementsByTagName('si'))strs.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
 const sh=await ler(alvo);if(!sh)throw new Error('Não encontrei a primeira aba da planilha');
 const col=ref=>{let c=0;for(const ch of ref.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1;};
 const rows=[];for(const r of xml(sh).getElementsByTagName('row')){const a=[];for(const c of r.getElementsByTagName('c')){const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let x=v?v.textContent:'';
  if(t==='s')x=strs[+x]??'';else if(t==='inlineStr')x=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');a[col(c.getAttribute('r'))]=String(x).trim();}
  const lin=Array.from(a,x=>x??'');if(lin.some(x=>x))rows.push(lin);}
 return rows;}
const EXEMPLOS=new Set(['JOÃO DA SILVA PEREIRA','MARIA APARECIDA SOUZA','CARLOS EDUARDO LIMA']);
async function importarColaboradores(file){
 try{const rows=(await lerPlanilha(file)).filter(r=>!/^matr/i.test(r[0]||''));
  const ex=rows.filter(r=>EXEMPLOS.has(String(r[1]||'').toUpperCase()));const uso=rows.filter(r=>!ex.includes(r));
  if(!uso.length){toast(ex.length?'A planilha só tem as linhas de exemplo. Preencha com a sua equipe.':'Nenhuma linha encontrada na planilha','erro');return;}
  const ok=uso.filter(r=>r[0]&&r[1]&&TURNOS.includes(String(r[3]||'').toUpperCase().replace('TURNO','').trim().replace(/^ADM.*/,'ADM'))),ruins=uso.length-ok.length;
  const novos=ok.filter(r=>!S.cadastro.some(p=>p.matricula===r[0])).length;
  modal(`<h2>${ic('upload')} Importar colaboradores</h2><p class="muted">${file.name}</p>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="l">Novos</div><div class="v">${novos}</div></div><div class="kpi"><div class="l">Atualizados</div><div class="v">${ok.length-novos}</div></div><div class="kpi" style="--c:#c93434"><div class="l">Com erro</div><div class="v" style="color:${ruins?'var(--err)':'inherit'}">${ruins}</div></div></div>
   ${ex.length?`<p class="tiny">${ex.length} linha(s) de exemplo do modelo foram ignoradas.</p>`:''}${ruins?`<p class="tiny" style="color:var(--err)">Linhas com erro (sem matrícula/nome ou turno diferente de A, B, C, ADM) não serão importadas.</p>`:''}
   <div class="tbw" style="max-height:220px"><table class="tb"><tr><th>Matrícula</th><th>Nome</th><th>Função</th><th>Turno</th><th>Perfil</th></tr>${ok.slice(0,30).map(r=>`<tr><td>${h(r[0])}</td><td>${h(r[1])}</td><td>${h(r[2])}</td><td>${h(r[3])}</td><td>${h(r[4]||'LANÇADOR')}</td></tr>`).join('')}</table></div>${ok.length>30?`<p class="tiny">+ ${ok.length-30} linha(s)</p>`:''}
   <div class="row" style="margin-top:14px"><button class="btn sec f1" data-m="0">Cancelar</button><button class="btn f1" data-m="1" ${ok.length?'':'disabled'}>Importar ${ok.length}</button></div>`,async(v,m)=>{m.remove();if(v==='1')await cadLote(ok.map(r=>[r[0],r[1],r[2],r[3],r[4]||''].join('\t')).join('\n'));});
 }catch(e){toast('Não consegui ler a planilha: '+e.message,'erro');}}
async function importarLocais(file){
 try{const rows=(await lerPlanilha(file)).filter(r=>!/^tipo$/i.test(r[0]||'')&&!/^nome$/i.test(r[1]||''));
  const exL=new Set(['MINA NORTE','FRENTE 03 – MINA NORTE','OFICINA CENTRAL']);
  const itens=rows.map(r=>r.length>1&&r[1]?{tipo:TIPOS_LOCAL.find(t=>t.toLowerCase()===String(r[0]).toLowerCase())||'Frente',nome:r[1]}:{tipo:'Frente',nome:r[0]}).filter(x=>x.nome);
  const sem=itens.filter(x=>!exL.has(normLocal(x.nome)));
  if(!sem.length){toast(itens.length?'A planilha só tem os exemplos. Preencha com os seus locais.':'Nenhuma linha encontrada','erro');return;}
  lcAdicionar(sem);}catch(e){toast('Não consegui ler a planilha: '+e.message,'erro');}}

/* ------------------------------ Tooltip ------------------------------ */
const tip=$('#tip');function hideTip(){tip.hidden=true;}
function showTip(el,x,y){tip.innerHTML=el.dataset.tip;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(6,L)+'px';tip.style.top=Math.max(6,T)+'px';}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});
document.addEventListener('scroll',hideTip,true);

/* ------------------------------ Ações ------------------------------ */
const ACOES={
 'nav':el=>ir(el.dataset.to),
 'entrar':()=>entrar(),
 'ver-senha':()=>{const v=$('#lgMat').value,s=$('#lgSenha').value;S.verSenha=!S.verSenha;render();$('#lgMat').value=v;$('#lgSenha').value=s;},
 'abrir-setup':()=>{S.setup=true;render();},
 'fechar-setup':()=>{S.setup=false;render();},
 'salvar-setup':async()=>{const u=$('#stUrl').value.trim();
  if(S.cfg.apiUrl&&u!==S.cfg.apiUrl){const pin=$('#stPin')?.value||'';const hs=await hashSenha('admin',pin);let ok=S.cfg.masterHash&&S.cfg.masterHash===hs;
   if(!ok&&online()){try{ok=(await api({action:'login',pin})).ok;}catch(e){}}if(!ok){toast('Para alterar o servidor informe a senha do administrador geral','erro');return;}}
  S.cfg.apiUrl=u;S.cfg.unidade=$('#stUn').value.trim();await setMeta('cfg',S.cfg);S.setup=false;toast('Aparelho configurado. Baixando cadastro…','ok');render();await sincronizar(true);render();},
 'menu-user':()=>modal(`<div class="row" style="margin-bottom:14px"><span class="av">${iniciais(S.user.nome)}</span><div class="f1"><b>${h(S.user.nome)}</b><div class="muted">${h(S.user.funcao||'')} · Turno ${h(S.user.turno||'—')}</div><div class="tiny">${h(S.user.perfil)}</div></div></div>
  <button class="btn sec bl" data-m="sync" style="margin-bottom:8px">${ic('sync')} Sincronizar agora</button>${!isAdm()?`<button class="btn sec bl" data-m="meus" style="margin-bottom:8px">${ic('list')} Meus envios</button>`:''}<button class="btn perigo bl" data-m="sair">${ic('out')} Sair</button>`,(v,m)=>{m.remove();if(v==='sair')sair();if(v==='sync')sincronizar(true);if(v==='meus')ir('meus');}),
 'sync':()=>sincronizar(true),
 'novo':el=>abrirForm(el.dataset.tipo),
 'continuar-rascunho':()=>{S.form=S.rascunho;S.erros=[];ir('form');},
 'descartar-rascunho':async()=>{if(!await confirmar('Descartar o rascunho?','Descartar'))return;S.rascunho=null;await setMeta('rascunho',null);render();},
 'salvar-form':()=>salvarForm(),
 'cancelar-form':async()=>{if(!await confirmar('Sair sem salvar? O rascunho fica guardado na tela Lançar.','Sair'))return;S.form=null;ir('lancar');},
 'add-linha':el=>{const f=campos(S.form.tipo).find(x=>x.k===el.dataset.k),row={};f.cols.forEach(c=>row[c.c]=c.def??'');S.form.dados[f.k].push(row);$('#lin-'+f.k).innerHTML=linhasHTML(f,S.form.dados[f.k]);atualizarCalcs();salvarRascunho();const ls=document.querySelectorAll(`#lin-${f.k} .linha`);ls[ls.length-1]?.querySelector('input,textarea,select')?.focus();},
 'rm-linha':async el=>{if(!await confirmar('Remover este item?','Remover'))return;const f=campos(S.form.tipo).find(x=>x.k===el.dataset.k);S.form.dados[f.k].splice(+el.dataset.i,1);$('#lin-'+f.k).innerHTML=linhasHTML(f,S.form.dados[f.k]);atualizarCalcs();salvarRascunho();},
 'cnt':el=>{const o=S.form.dados[el.dataset.k],c=el.dataset.c;o[c]=Math.max(0,(o[c]||0)+ +el.dataset.d);const out=$('#cnt-'+c);out.textContent=o[c];out.classList.toggle('nz',o[c]>0);$('#tot-'+el.dataset.k).textContent=totalCont(o);salvarRascunho();},
 'filtro':el=>{S.filtro=el.dataset.f;render();},
 'acfiltro':el=>{S.acFiltro=el.dataset.f;render();},
 'ver':el=>{S.verId=el.dataset.id;S.verRemoto=!!el.dataset.r;render();window.scrollTo(0,0);},
 'voltar':()=>{S.verId=null;S.verRemoto=null;render();},
 'editar':el=>{const r=S.regs.find(x=>x.id===el.dataset.id);if(r&&r.status==='pendente'){S.verId=null;abrirForm(r.tipo,r);}},
 'cancelar-reg':async el=>{const r=S.regs.find(x=>x.id===el.dataset.id);if(!r||r.status!=='pendente')return;if(!await confirmar('Cancelar este lançamento? Ele será registrado como CANCELADO no servidor (não some sem rastro).','Cancelar lançamento'))return;r.cancelado=true;r.resumo='[CANCELADO] '+(r.resumo||'');await putReg(r);await recarregarRegs();S.verId=null;render();sincronizar();},
 'excluir-rej':async el=>{if(!await confirmar('Remover este lançamento recusado do aparelho?','Remover'))return;await delReg(el.dataset.id);await recarregarRegs();S.verId=null;render();},
 'concluir':el=>concluirAcao(el.dataset.id),
 'ptipo':el=>{S.ptipo=el.dataset.t;render();},
 'lc-add':()=>lcAdicionar([{nome:$('#lcNome').value,tipo:(document.querySelector('input[name=lcTipo]:checked')||{}).value}]),
 'lc-lote':()=>lcAdicionar($('#lcLote').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t|;/).map(x=>x.trim());return c.length>1?{tipo:TIPOS_LOCAL.find(t=>t.toLowerCase()===c[0].toLowerCase())||'Frente',nome:c[1]}:{nome:c[0],tipo:'Frente'};})),
 'lc-rm':async el=>{if(!await confirmar('Excluir da lista?','Excluir'))return;S.locEdit.splice(+el.dataset.i,1);render();},
 'lc-desfazer':()=>{S.locEdit=null;render();},
 'lc-salvar':()=>lcSalvar(),
 'imp-col':()=>{S.impAlvo='col';$('#filePlan').click();},
 'imp-loc':()=>{S.impAlvo='loc';$('#filePlan').click();},
 'mt-add-f':()=>{const f=$('#mtFunc').value;if(!f)return;S.metasEdit.funcoes[f]=JSON.parse(JSON.stringify(S.metasEdit.padrao||{sem:{},men:{}}));render();},
 'mt-add-p':()=>{const m=$('#mtPes').value;if(!m)return;const p=S.cadastro.find(x=>x.matricula===m),b=metaDe(p)||{sem:{},men:{}};S.metasEdit.pessoas[m]={sem:{...b.sem},men:{...b.men}};render();},
 'mt-rm':async el=>{if(!await confirmar('Remover esta meta?','Remover'))return;delete S.metasEdit[el.dataset.g][el.dataset.k];render();},
 'mt-desfazer':()=>{S.metasEdit=null;render();},
 'mt-salvar':()=>salvarMetas(),
 'ass-limpar':el=>{const cv=document.querySelector(`canvas[data-ass="${el.dataset.k}"]`);if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);S.form.dados[el.dataset.k]='';salvarRascunho();},
 'exportar':()=>exportar(),
 'importar':()=>$('#fileImport').click(),
 'central-atualizar':()=>carregarCentral(),
 'cad-salvar':()=>cadSalvar(),
 'cad-limpar':()=>{S.cadEdit=null;render();},
 'cad-editar':el=>{const p=S.cadastro.find(x=>x.matricula===el.dataset.m);S.cadEdit={...p,_ed:true};render();window.scrollTo(0,0);},
 'cad-lote':()=>cadLote(),
 'cfg-salvar':async()=>{S.cfg.apiUrl=$('#cfgUrl').value.trim();S.cfg.unidade=$('#cfgUn').value.trim();await setMeta('cfg',S.cfg);toast('Configuração salva','ok');sincronizar(true);render();},
 'cfg-testar':async()=>{const u=$('#cfgUrl').value.trim();if(!u&&!window.DEMO_API){toast('Informe o endereço','erro');return;}const old=S.cfg.apiUrl;S.cfg.apiUrl=u;try{const r=await api({action:'ping'});toast('Conexão OK · servidor v'+(r.versao||'?'),'ok');}catch(e){toast('Falhou: '+e.message,'erro');}finally{S.cfg.apiUrl=old;}},
 'copiar-link':async()=>{try{await navigator.clipboard.writeText($('#lnk').value);toast('Link copiado','ok');}catch(e){$('#lnk').select();toast('Selecione e copie o link');}},
 'instalar':async()=>{if(!S.instalar)return;S.instalar.prompt();await S.instalar.userChoice;S.instalar=null;render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACOES[el.dataset.act];if(f){e.preventDefault();f(el);}});
root.addEventListener('input',onCampo);root.addEventListener('change',onCampo);
root.addEventListener('focusout',e=>{const el=e.target;if(!S.form||S.tela!=='form'||!(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!el.type.match(/date|time|number|checkbox|radio/)&&!el.hasAttribute('list'))))return;
 const nv=corrigirTexto(el.value);if(nv!==el.value){el.value=nv;onCampo({target:el});el.classList.add('corrigido');setTimeout(()=>el.classList.remove('corrigido'),1200);}});
root.addEventListener('input',e=>{const id=e.target.id;
 if(id==='cadBusca'){S.cadBusca=e.target.value;$('#cadLista').innerHTML=cadListaHTML();}
 if(id==='locBusca'){S.locBusca=e.target.value;clearTimeout(S._tl);S._tl=setTimeout(()=>{const p=e.target.selectionStart;render();const b=$('#locBusca');if(b){b.focus();b.setSelectionRange(p,p);}},250);}
 const t=e.target;if(t.dataset.mg){const E=S.metasEdit,o=t.dataset.mg==='padrao'?E.padrao:E[t.dataset.mg][t.dataset.mk];o[t.dataset.mp]=o[t.dataset.mp]||{};o[t.dataset.mp][t.dataset.mt]=t.value===''?'':Math.max(0,+t.value);
  const tb=t.closest('table');if(tb){const tt=tb.querySelector('tr.tt');if(tt)tt.innerHTML=`<td>Total</td><td class="n">${somaMeta(o.sem)}</td><td class="n">${somaMeta(o.men)}</td>`;}}
 if(id==='busca'){S.busca=e.target.value;clearTimeout(S._tb);S._tb=setTimeout(()=>{const p=e.target.selectionStart;render();const b=$('#busca');if(b){b.focus();b.setSelectionRange(p,p);}},250);}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.li!==undefined){const l=S.locEdit[+t.dataset.li];if(!l)return;l[t.dataset.lf]=t.type==='checkbox'?t.checked:t.dataset.lf==='nome'?normLocal(t.value):t.value;render();return;}
 const f=e.target.dataset.f;if(!f)return;
 if(f==='dIni'||f==='dFim'){if(!e.target.value)return;const [a,b]=periodo();S.dIni=f==='dIni'?e.target.value:a;S.dFim=f==='dFim'?e.target.value:b;if(S.dIni>S.dFim)[S.dIni,S.dFim]=[S.dFim,S.dIni];S.per='custom';render();return;}
 if(e.target.tagName!=='SELECT')return;S[f]=e.target.value;if(f==='cadTurno'||f==='cadPerfil')$('#cadLista').innerHTML=cadListaHTML();else render();});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lgSenha'||e.target.id==='lgMat')){e.preventDefault();if(e.target.id==='lgMat')$('#lgSenha').focus();else entrar();}});
$('#filePlan').addEventListener('change',e=>{const f=e.target.files[0];if(f)(S.impAlvo==='loc'?importarLocais:importarColaboradores)(f);e.target.value='';});
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(f)importar(f);e.target.value='';});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.instalar=e;if(S.tela==='config')render();});
window.addEventListener('online',()=>{renderStatus();sincronizar();});
window.addEventListener('offline',()=>renderStatus());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user)sincronizar();});

/* ------------------------------ Inicialização ------------------------------ */
async function init(){
 try{
  S.deviceId=await getMeta('deviceId');if(!S.deviceId){S.deviceId=uuid();await setMeta('deviceId',S.deviceId);}
  S.cfg=Object.assign(S.cfg,await getMeta('cfg',{}));
  try{const s=new URLSearchParams(location.search).get('s');if(s&&/^https:\/\//.test(s)&&!S.cfg.apiUrl){S.cfg.apiUrl=s;await setMeta('cfg',S.cfg);history.replaceState(null,'',location.pathname);}}catch(e){}
  S.user=await getMeta('user',null);S.auth=await getMeta('auth',null);S.cadastro=await getMeta('cadastro',[]);S.hist=await getMeta('hist',{});S.lastSync=await getMeta('lastSync',null);
  S.rascunho=await getMeta('rascunho',null);S.seq=await getMeta('seq',0);S.metas=await getMeta('metas',null);S.locais=await getMeta('locais',[]);S.meusSrv=await getMeta('meusSrv',null);
  if(window.DEMO_INIT)await window.DEMO_INIT();
  const rest=await restaurarEspelho();await recarregarRegs();
  const mx=Math.max(0,...S.regs.filter(r=>r.deviceId===S.deviceId).map(r=>r.seq||0));if(mx>S.seq){S.seq=mx;await setMeta('seq',mx);}
  if(rest)toast(`${rest} lançamento(s) recuperado(s) da cópia de segurança`,'ok');
  if(isAdm())S.central=await getMeta('central',null);
 }catch(e){root.innerHTML=`<div class="aviso" style="margin:20px">Erro ao abrir o armazenamento do aparelho: ${h(e.message)}. Não use aba anônima.</div>`;return;}
 try{if(navigator.storage&&navigator.storage.persist){S.persist=await navigator.storage.persisted();if(!S.persist)S.persist=await navigator.storage.persist();}}catch(e){}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.DEMO_API)navigator.serviceWorker.register('sw.js').catch(()=>{});
 S.tela=isAdm()?'painel':'lancar';
 render();
 setInterval(()=>{if(S.user)sincronizar();},90000);
 if(S.user){sincronizar();if(isAdm())carregarCentral(true);}else if(S.cfg.apiUrl&&!S.cadastro.length)sincronizar();
}
init();
</script>
</body>
